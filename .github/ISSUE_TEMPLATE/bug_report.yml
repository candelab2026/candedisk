name: Report a problem
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not include personal data** in the log or the summary.
        For security vulnerabilities use private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you were doing and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. I select the disk ...
        2. I press Format ...
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The full text shown by the program.
      render: text
  - type: input
    id: version
    attributes:
      label: CandeDisk version
      description: Help > About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Interface language
      description: Useful for translation problems.
      placeholder: "English"
  - type: textarea
    id: summary
    attributes:
      label: Disk summary
      description: File > Copy disk summary, then paste here.
      render: text
