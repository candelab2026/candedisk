name: Suggest a feature
description: An idea to improve CandeDisk
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation in which you need this feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you imagine it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
