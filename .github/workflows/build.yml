name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build (Release, warnings are errors)
        run: dotnet build CandeDisk.sln -c Release --nologo -warnaserror

      - name: Test
        run: dotnet test CandeDisk.sln -c Release --no-build --nologo
