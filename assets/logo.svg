    <circle r="70" pathLength="440" stroke="#2F7DE1" stroke-dasharray="208 232" stroke-dashoffset="0"/>
    <circle r="70" pathLength="440" stroke="#3FB27F" stroke-dasharray="112 328" stroke-dashoffset="-215"/>
    <circle r="70" pathLength="440" stroke="#F2A93B" stroke-dasharray="56 384" stroke-dashoffset="-334"/>
    <circle r="70" pathLength="440" stroke="#8FA3BF" stroke-dasharray="36 404" stroke-dashoffset="-397"/>
  </g>
  <circle cx="128" cy="128" r="26" fill="#E8EEF8"/>
  <circle cx="128" cy="128" r="9" fill="#0C182E"/>
</svg>
